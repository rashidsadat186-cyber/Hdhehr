<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کهاته</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--bd:#e2e0d8;--ac:#0f6e56;--rd:#b3261e;--gn:#0f6e56;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#201f1d;--tx:#f0eee8;--mu:#a09e96;--bd:#33322e;--ac:#3fb893;--rd:#f2877f;--gn:#3fb893}}
:root[data-theme="dark"]{--bg:#141413;--card:#201f1d;--tx:#f0eee8;--mu:#a09e96;--bd:#33322e;--ac:#3fb893;--rd:#f2877f;--gn:#3fb893}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tahoma,"Vazirmatn",system-ui,sans-serif;max-width:640px;margin:auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.box,.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.box small{color:var(--mu);display:block;margin-bottom:4px}.box b{font-size:18px}
input,button,textarea{font:inherit;color:var(--tx)}
input,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-bottom:8px}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.r{background:var(--rd)}
.row{display:flex;gap:8px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer}
.item small{color:var(--mu)}
.pos{color:var(--rd)}.neg{color:var(--gn)}
.t{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.t:last-child{border:0}.t small{color:var(--mu)}
.x{background:none;color:var(--mu);padding:0 6px;flex:none;border:0}
.empty{color:var(--mu);text-align:center;padding:20px}
.fl{color:#b26a00;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S={c:[]},cur=null,q="",ed=null,srt=0,box="";
try{var r=localStorage.getItem("khata");if(r)S=JSON.parse(r)}catch(e){}
function save(){try{localStorage.setItem("khata",JSON.stringify(S))}catch(e){}}
function bal(c){return c.t.reduce(function(a,x){return a+(isP(x.type)?x.amt:-x.amt)},0)}
var TL={d:"جنس دادیم",p:"پول گرفتیم",b:"جنس گرفتیم",q:"پول دادیم"};
function isP(t){return t==="d"||t==="q"}
function brk(c){var s={d:0,p:0,b:0,q:0};c.t.forEach(function(x){s[x.type]+=x.amt});return "جنس دادیم: "+f(s.d)+" · جنس گرفتیم: "+f(s.b)+"<br>پول گرفتیم: "+f(s.p)+" · پول دادیم: "+f(s.q)}
function f(n){return Math.abs(n).toLocaleString("en-US")+" افغانی"}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){var n=new Date();return n.getFullYear()+"-"+("0"+(n.getMonth()+1)).slice(-2)+"-"+("0"+n.getDate()).slice(-2)}
function g2j(gy,gm,gd){var g=[0,31,59,90,120,151,181,212,243,273,304,334];var jy=gy<=1600?0:979;gy-=gy<=1600?621:1600;var gy2=gm>2?gy+1:gy;var days=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400)-80+gd+g[gm-1];jy+=33*Math.floor(days/12053);days%=12053;jy+=4*Math.floor(days/1461);days%=1461;if(days>365){jy+=Math.floor((days-1)/365);days=(days-1)%365}var jm=days<186?1+Math.floor(days/31):7+Math.floor((days-186)/30);var jd=1+(days<186?days%31:(days-186)%30);return[jy,jm,jd]}
function j2g(jy,jm,jd){var gy=jy<=979?621:1600;jy-=jy<=979?0:979;var days=365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){days--;gy+=100*Math.floor(days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}var gd=days+1;var m=[0,31,(gy%4==0&&gy%100!=0)||gy%400==0?29:28,31,30,31,30,31,31,30,31,30,31];var gm;for(gm=0;gm<13;gm++){if(gd<=m[gm])break;gd-=m[gm]}return[gy,gm,gd]}
function toJ(s){var p=s.split("-"),j=g2j(+p[0],+p[1],+p[2]);return j[0]+"/"+("0"+j[1]).slice(-2)+"/"+("0"+j[2]).slice(-2)}
function fromJ(s){s=String(s).replace(/[۰-۹]/g,function(c){return c.charCodeAt(0)-1776}).replace(/[٠-٩]/g,function(c){return c.charCodeAt(0)-1632});var p=s.trim().split(/[^0-9]+/).map(Number);if(p.length!==3||p.some(isNaN)||p[1]<1||p[1]>12||p[2]<1||p[2]>(p[1]<7?31:30))return null;var g=j2g(p[0],p[1],p[2]);return g[0]+"-"+("0"+g[1]).slice(-2)+"-"+("0"+g[2]).slice(-2)}
function rd(){var d=fromJ(document.getElementById("dt").value);if(!d)alert("تاریخ درست نیست، مثل 1405/09/04 بنویسید");return d}
function C(){return S.c.find(function(x){return x.id===cur})}
function render(){
 var a=document.getElementById("app");
 if(cur){var c=C();if(!c){cur=null;return render()}
  var b=bal(c),e=ed?c.t.find(function(x){return x.id===ed}):null;
  a.innerHTML='<button class="o" onclick="cur=null;ed=null;box=\'\';render()">← برگشت</button><h1>'+esc(c.name)+'</h1>'+
  (c.phone?'<p style="color:var(--mu);margin:0 0 10px">'+esc(c.phone)+'</p>':'')+
  '<div class="box" style="margin-bottom:12px"><small>'+(b>0?"او به ما قرضدار است":b<0?"ما به او قرضدار استیم":"حساب صاف است")+'</small><b class="'+(b>0?"pos":"neg")+'">'+f(b)+'</b><div style="margin-top:8px;font-size:13px;color:var(--mu);line-height:1.8">'+brk(c)+'</div></div>'+
  '<div class="card" style="margin-bottom:12px"><b style="display:block;margin-bottom:8px">'+(e?"درست کردن معامله":"معامله جدید")+'</b>'+
  '<input id="am" type="number" inputmode="decimal" placeholder="مبلغ" value="'+(e?e.amt:"")+'"><input id="dt" inputmode="numeric" placeholder="تاریخ شمسی مثل 1405/09/04" value="'+toJ(e?e.date:today())+'"><input id="nt" placeholder="توضیح (اختیاری)" value="'+(e?esc(e.note||""):"")+'">'+
  (e?'<div class="row"><button class="'+(e.type==="d"?"r":"")+'" onclick="saveT()">ذخیره ('+TL[e.type]+')</button><button class="o" onclick="ed=null;render()">لغو</button></div>':
  '<div class="row"><button class="r" onclick="addT(\'d\')">جنس دادیم</button><button onclick="addT(\'p\')">پول گرفتیم</button></div><div class="row" style="margin-top:8px"><button class="o" onclick="addT(\'b\')">جنس گرفتیم</button><button class="o" onclick="addT(\'q\')">پول دادیم</button></div>')+'</div>'+
  '<div class="card">'+(c.t.length?c.t.slice().sort(function(x,y){return y.date<x.date?-1:y.date>x.date?1:0}).map(function(x){return '<div class="t"><div><b class="'+(isP(x.type)?"pos":"neg")+'">'+TL[x.type]+": "+f(x.amt)+'</b>'+(x.dis?' <span class="fl">⚑ اختلافی</span>':'')+'<br><small>'+esc(x.note||"")+' '+toJ(x.date)+'</small></div><div style="flex:none"><button class="x" title="اختلافی" onclick="dis(\''+x.id+'\')">⚑</button><button class="x" onclick="ed=\''+x.id+'\';render()">✎</button><button class="x" onclick="delT(\''+x.id+'\')">✕</button></div></div>'}).join(""):'<div class="empty">هنوز معامله‌ای نیست</div>')+'</div>'+
  '<div class="row" style="margin-top:12px"><button class="o" onclick="stmt()">صورت حساب</button><button class="o" onclick="delC()">حذف مشتری</button></div>'+
  (box?'<textarea id="bx" rows="8" style="margin-top:10px" readonly onclick="this.select()">'+esc(box)+'</textarea>':'');
  return}
 var tot=S.c.map(bal),rec=tot.filter(function(x){return x>0}).reduce(function(a,x){return a+x},0),pay=-tot.filter(function(x){return x<0}).reduce(function(a,x){return a+x},0);
 a.innerHTML='<h1>📒 کهاته</h1><div class="sum"><div class="box"><small>جمله طلب ما</small><b class="pos">'+f(rec)+'</b></div><div class="box"><small>جمله قرض ما</small><b class="neg">'+f(pay)+'</b></div></div>'+
 '<div class="card" style="margin-bottom:12px"><input id="nn" placeholder="نام مشتری جدید"><input id="np" placeholder="شماره تلفن (اختیاری)"><button style="width:100%" onclick="addC()">+ اضافه کردن مشتری</button></div>'+
 '<div class="row"><input id="sq" placeholder="جستجو..." value="'+esc(q)+'" oninput="q=this.value;list_()" style="flex:2"><button class="o" style="margin-bottom:8px" onclick="srt=(srt+1)%2;list_()">'+(srt?"بیشترین قرض":"نام")+'</button></div><div id="ls"></div>'+
 '<div class="row" style="margin-top:12px"><button class="o" onclick="bk()">نسخه پشتیبان</button><button class="o" onclick="rs()">بازیابی</button></div>'+
 (box?'<textarea id="bx" rows="6" style="margin-top:10px" onclick="this.select()">'+esc(box)+'</textarea>'+(box==="__"?"":'')+'':'');
 if(box==="__"){document.getElementById("bx").value="";document.getElementById("bx").readOnly=false;document.getElementById("bx").placeholder="متن پشتیبان را اینجا بچسبانید";a.insertAdjacentHTML("beforeend",'<button style="width:100%" onclick="doRs()">بازیابی کن</button>')}
 list_()}
function list_(){
 var l=S.c.filter(function(c){return c.name.indexOf(q)>-1});
 l.sort(function(x,y){return srt?bal(y)-bal(x):x.name.localeCompare(y.name,"fa")});
 var el=document.getElementById("ls");
 el.innerHTML=l.length?l.map(function(c){var b=bal(c);return '<div class="card item" onclick="cur=\''+c.id+'\';box=\'\';render()"><div><b>'+esc(c.name)+'</b><br><small>'+esc(c.phone||"")+'</small></div><b class="'+(b>0?"pos":"neg")+'">'+f(b)+'</b></div>'}).join(""):'<div class="empty">مشتری‌ای نیست</div>'}
function addC(){var n=document.getElementById("nn").value.trim();if(!n)return;S.c.push({id:uid(),name:n,phone:document.getElementById("np").value.trim(),t:[]});save();render()}
function addT(type){var v=parseFloat(document.getElementById("am").value);if(!(v>0))return;var d=rd();if(!d)return;C().t.push({id:uid(),type:type,amt:v,note:document.getElementById("nt").value.trim(),date:d});save();render()}
function saveT(){var v=parseFloat(document.getElementById("am").value);if(!(v>0))return;var d=rd();if(!d)return;var x=C().t.find(function(y){return y.id===ed});x.amt=v;x.note=document.getElementById("nt").value.trim();x.date=d;ed=null;save();render()}
function dis(id){var x=C().t.find(function(y){return y.id===id});x.dis=!x.dis;save();render()}
function delT(id){if(!confirm("این معامله حذف شود؟"))return;var c=C();c.t=c.t.filter(function(x){return x.id!==id});save();render()}
function delC(){if(!confirm("این مشتری و تمام معاملاتش حذف شود؟"))return;S.c=S.c.filter(function(x){return x.id!==cur});cur=null;save();render()}
function stmt(){var c=C();box="صورت حساب: "+c.name+"\n"+c.t.slice().sort(function(x,y){return x.date<y.date?-1:1}).map(function(x){return toJ(x.date)+"  "+TL[x.type]+" "+x.amt+"  "+(x.note||"")}).join("\n")+"\nباقی: "+(bal(c)>0?"او قرضدار است ":"ما قرضدار استیم ")+f(bal(c));render()}
function bk(){box=JSON.stringify(S);render()}
function rs(){box="__";render()}
function doRs(){try{var d=JSON.parse(document.getElementById("bx").value);if(!d.c)throw 0;if(!confirm("اطلاعات فعلی با پشتیبان عوض شود؟"))return;S=d;save();box="";render()}catch(e){alert("متن پشتیبان درست نیست")}}
render();
</script>
</body>
</html>
